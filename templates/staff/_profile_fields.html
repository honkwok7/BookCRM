{% for title, fields in form.sections %}
  <fieldset class="grid gap-4">
    <legend class="mb-2 text-sm font-semibold text-slate-900">{{ title }}</legend>
    <div class="grid gap-4 {% if title == 'Profile' %}sm:grid-cols-2{% endif %}">
      {% for field in fields %}{% if field.name == "appointment_color" %}{% include "staff/_color_field.html" %}{% else %}{% include "components/field.html" with field=field %}{% endif %}{% endfor %}
    </div>
  </fieldset>
{% endfor %}
