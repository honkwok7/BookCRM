{% extends "layouts/public.html" %}
{% block title %}Page not found · {{ brand_name }}{% endblock %}
{% block main %}
<div class="mx-auto max-w-lg px-4 py-16 text-center">
  <p class="text-sm font-semibold text-brand-700">404</p>
  <h1 class="mt-2 text-3xl font-bold tracking-tight">Page not found</h1>
  <p class="mt-3 text-slate-700">The page you're looking for doesn't exist or has moved.</p>
  <div class="mt-8"><a class="btn btn-primary" href="{% if user.is_authenticated %}{% url 'home' %}{% else %}{% url 'landing' %}{% endif %}">Go to the home page</a></div>
</div>
{% endblock %}
