# Production-style stack for one server (docs/DEPLOY_HETZNER.md):
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Only Caddy is reachable from outside (ports 80 and 443, HTTPS). PostgreSQL, Redis and the
# app are on the internal network with no published ports. docker-compose.yml stays the
# local development stack.

name: bookcrm

x-app: &app
  build: .
  image: bookcrm-app
  env_file: .env.production
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env.production and pass --env-file .env.production}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/auth:/etc/caddy/auth:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    <<: *app
    environment:
      RUN_MIGRATIONS: "1"
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${WEB_WORKERS:-3} --access-logfile -
    volumes:
      - media:/app/media
    healthcheck:
      test: ["CMD", "python", "deploy/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  celery:
    <<: *app
    command: celery -A config worker -l info
    volumes:
      - media:/app/media

  celery-beat:
    <<: *app
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookcrm}
      POSTGRES_USER: ${POSTGRES_USER:-bookcrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly no
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  media:
  caddy_data:
  caddy_config:
