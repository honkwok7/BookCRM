# Mirrors CI: Ruff (lint + import sorting via the "I" rules) and Black (formatting).
# ruff-format and isort are intentionally not used; they disagree with Black/Ruff on some files.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
