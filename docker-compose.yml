services:
  web:
    build: .
    container_name: schedula-web
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "1"
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5

  db:
    image: postgres:17
    container_name: schedula-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schedula}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: schedula-redis
    ports:
      - "6379:6379"

  celery:
    build: .
    container_name: schedula-celery
    command: celery -A config worker -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    container_name: schedula-celery-beat
    command: celery -A config beat -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
